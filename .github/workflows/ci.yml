name: CI/CD

on: [push, pull_request]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Auto-fix y commit formato
        run: |
          ruff format . 2>&1 || true
          ruff check --fix . 2>&1 || true
          git config user.name "ci-bot" && git config user.email "ci@bot"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style: auto-fix ruff [skip ci]"
            git push
          fi
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy src/ --show-error-codes
      - name: Sanity check
        run: python -c "import os; assert os.path.isdir('src') and os.path.isfile('run_bot_prod.sh')"
      - name: Run tests
        run: python -m pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=64
