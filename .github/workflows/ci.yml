name: Diagnostico CI

on: [push]

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Corregir formato automaticamente
        run: |
          ruff format . 2>&1 || true
          ruff check --fix . 2>&1 || true
      - name: Validar
        run: |
          set +e
          {
            echo '=== RUFF CHECK ==='
            ruff check .
            echo "exit=$?"
            echo '=== RUFF FORMAT ==='
            ruff format --check .
            echo "exit=$?"
            echo '=== MYPY ==='
            mypy src/ --show-error-codes
            echo "exit=$?"
            echo '=== PYTEST (fast) ==='
            python -m pytest tests/test_survivor_reglas_oficiales.py tests/test_totales_desempate.py tests/test_telegram_vida_empate.py -v 2>&1
            echo "exit=$?"
            echo '=== PYTEST (full) ==='
            python -m pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=64 -x 2>&1
            echo "exit=$?"
          } > ci-debug-v2.txt 2>&1
          cat ci-debug-v2.txt
      - name: Commit correcciones de formato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style: aplica formato automático [skip ci]"
            git push
          fi
