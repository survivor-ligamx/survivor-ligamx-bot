name: CI/CD

on: [push, pull_request]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Improve tiebreak totals once
        if: github.event_name == 'push'
        run: |
          pip install ruff
          python - <<'PY'
          from pathlib import Path
          import re

          partidos = Path('src/telegram/formato_partidos.py')
          text = partidos.read_text()
          nuevo = '''def _totales_jornada(pronosticos: list, partidos_esperados: int = _MAX_PARTIDOS) -> Dict[str, Any]:
              """Calcula cobertura y un total utilizable como desempate del Survivor."""
              esperados = max(0, int(partidos_esperados))
              recibidos = len(pronosticos)
              goles_por_partido: List[float] = []
              for pronostico in pronosticos:
                  try:
                      local = float(pronostico["goles_esperados_local"])
                      visitante = float(pronostico["goles_esperados_visitante"])
                  except (KeyError, TypeError, ValueError):
                      continue
                  goles_por_partido.append(local + visitante)

              con_xg = len(goles_por_partido)
              total_goles = sum(goles_por_partido)
              promedio = total_goles / con_xg if con_xg else 0.0
              cobertura_completa = esperados > 0 and con_xg >= esperados
              desempate = int(total_goles + 0.5) if cobertura_completa else None
              over_25 = sum(1 for p in pronosticos if p.get("pick_ou") == "Over")
              under_25 = sum(1 for p in pronosticos if p.get("pick_ou") == "Under")
              btts_si = sum(1 for p in pronosticos if p.get("pick_btts") == "Sí")
              btts_no = sum(1 for p in pronosticos if p.get("pick_btts") == "No")
              return {
                  "partidos": recibidos,
                  "partidos_esperados": esperados,
                  "partidos_con_xg": con_xg,
                  "partidos_sin_xg": max(0, esperados - con_xg),
                  "cobertura_completa": cobertura_completa,
                  "goles_desempate": desempate,
                  "goles_esperados_total": round(total_goles, 1),
                  "promedio_goles_partido": round(promedio, 2),
                  "over_25_count": over_25,
                  "under_25_count": under_25,
                  "btts_si_count": btts_si,
                  "btts_no_count": btts_no,
              }


          def construir_mensaje_momios'''
          text, count = re.subn(
              r'def _totales_jornada\(.*?\n\n\ndef construir_mensaje_momios',
              nuevo,
              text,
              count=1,
              flags=re.S,
          )
          assert count == 1
          partidos.write_text(text)

          formato = Path('src/telegram/formato.py')
          text = formato.read_text()
          viejo = '''        totales = _totales_jornada(pronosticos)
                  lineas.append(f"⚽ Goles esperados totales: {totales['goles_esperados_total']}")
                  lineas.append(f"📊 Promedio por partido: {totales['promedio_goles_partido']}")
                  lineas.append(f"🔺 Over 2.5: {totales['over_25_count']} partidos")
                  lineas.append(f"🔻 Under 2.5: {totales['under_25_count']} partidos")
                  lineas.append(f"✅ BTTS Sí: {totales['btts_si_count']} partidos")
                  lineas.append(f"❌ BTTS No: {totales['btts_no_count']} partidos")'''
          nuevo = '''        totales = _totales_jornada(pronosticos)
                  lineas.append(
                      f"📋 Cobertura: {totales['partidos']}/{totales['partidos_esperados']} partidos recibidos · "
                      f"{totales['partidos_con_xg']}/{totales['partidos_esperados']} con modelo de goles"
                  )
                  if totales["goles_desempate"] is not None:
                      lineas.append(
                          f"🎯 <b>Pronóstico para desempate: {totales['goles_desempate']} goles</b>"
                      )
                  else:
                      lineas.append(
                          f"⚠️ Desempate provisional: faltan {totales['partidos_sin_xg']} partidos con modelo; "
                          "no uses todavía este total como definitivo."
                      )
                  lineas.append(f"⚽ xG acumulado disponible: {totales['goles_esperados_total']}")
                  lineas.append(f"📊 Promedio por partido modelado: {totales['promedio_goles_partido']}")
                  lineas.append(f"🔺 Over 2.5: {totales['over_25_count']} partidos")
                  lineas.append(f"🔻 Under 2.5: {totales['under_25_count']} partidos")
                  lineas.append(f"✅ BTTS Sí: {totales['btts_si_count']} partidos")
                  lineas.append(f"❌ BTTS No: {totales['btts_no_count']} partidos")'''
          assert viejo in text
          formato.write_text(text.replace(viejo, nuevo, 1))

          pruebas = Path('tests/test_telegram_formato.py')
          text = pruebas.read_text()
          ancla = '''        self.assertAlmostEqual(t["promedio_goles_partido"], 1.65, places=2)
          '''
          agregado = '''        self.assertAlmostEqual(t["promedio_goles_partido"], 1.65, places=2)

              def test_desempate_solo_con_cobertura_completa(self):
                  pronosticos = [
                      {
                          "goles_esperados_local": 1.4,
                          "goles_esperados_visitante": 1.1,
                          "pick_ou": "Over",
                          "pick_btts": "Sí",
                      },
                      {
                          "goles_esperados_local": 0.8,
                          "goles_esperados_visitante": 0.7,
                          "pick_ou": "Under",
                          "pick_btts": "No",
                      },
                  ]
                  t = tp._totales_jornada(pronosticos, partidos_esperados=2)
                  self.assertTrue(t["cobertura_completa"])
                  self.assertEqual(t["partidos_con_xg"], 2)
                  self.assertEqual(t["goles_desempate"], 4)

              def test_partido_solo_momios_no_reduce_el_promedio_xg(self):
                  pronosticos = [
                      {"goles_esperados_local": 1.5, "goles_esperados_visitante": 1.0},
                      {"mercado": {"1x2": {}}},
                  ]
                  t = tp._totales_jornada(pronosticos, partidos_esperados=2)
                  self.assertEqual(t["partidos"], 2)
                  self.assertEqual(t["partidos_con_xg"], 1)
                  self.assertFalse(t["cobertura_completa"])
                  self.assertIsNone(t["goles_desempate"])
                  self.assertEqual(t["promedio_goles_partido"], 2.5)
          '''
          assert ancla in text
          pruebas.write_text(text.replace(ancla, agregado, 1))
          PY
          ruff format src/telegram/formato.py src/telegram/formato_partidos.py tests/test_telegram_formato.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/telegram/formato.py src/telegram/formato_partidos.py tests/test_telegram_formato.py
          if ! git diff --cached --quiet; then
            git commit -m "fix: mejora totales para desempate Survivor"
            git push
          fi
