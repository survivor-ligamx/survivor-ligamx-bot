name: CI/CD

on: [push, pull_request]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Capture lint diagnostics once
        if: github.event_name == 'push'
        run: |
          ruff check . > ci_ruff.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci_ruff.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci: captura diagnóstico de lint"
            git push
          fi

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src/ --show-error-codes

      - name: Sanity check (estructura)
        run: python -c "import os; assert os.path.isdir('src') and os.path.isfile('run_bot_prod.sh')"

      - name: Run tests
        run: python -m pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=64
