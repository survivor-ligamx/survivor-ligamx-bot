name: QuickDiag

on: [push]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Diagnose
        run: |
          set +e
          ruff format . 2>&1 || true
          echo "--- RUFF CHECK ---" && ruff check . 2>&1; echo "RC=$?"
          echo "--- RUFF FORMAT ---" && ruff format --check . 2>&1; echo "RF=$?"
          echo "--- MYPY ---" && mypy src/ --show-error-codes 2>&1; echo "MP=$?"
          echo "--- FULL PYTEST (first fail) ---" && python -m pytest tests/ -x --tb=short 2>&1 | tail -50; echo "PF=$?"
