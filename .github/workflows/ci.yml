name: Diagnostico CI

on: [push]

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Capturar resultados
        run: |
          set +e
          {
            echo '=== RUFF CHECK ==='
            ruff check .
            echo "exit=$?"
            echo '=== RUFF FORMAT ==='
            ruff format --check .
            echo "exit=$?"
            echo '=== MYPY ==='
            mypy src/ --show-error-codes
            echo "exit=$?"
            echo '=== PYTEST ==='
            python -m pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=64
            echo "exit=$?"
          } > ci-debug.txt 2>&1
          cat ci-debug.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-debug.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci: publica diagnóstico de validaciones"
            git push
          fi
