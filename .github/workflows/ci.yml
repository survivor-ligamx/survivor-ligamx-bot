name: CI/CD

on: [push, pull_request]

permissions:
  contents: write

jobs:
  fix-pr43:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]' && github.ref_name == 'copilot/fix-308490185-1289689659-68343ccb-cd87-4d5d-8e2a-06040aa18600'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: copilot/fix-308490185-1289689659-68343ccb-cd87-4d5d-8e2a-06040aa18600
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install 'ruff>=0.15.0'
      - name: Patch precedence and alias
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/contexto_web_partidos.py')
          text = path.read_text()
          old = '''    elif "convoc" in texto:
              tipo = "CONVOCATORIA"
          elif any(x in texto for x in ("podria debutar", "puede debutar", "debut posible")):
              tipo = "DEBUT_POSIBLE"
          '''.replace('              ', '        ').replace('          elif', '    elif').replace('          ', '')
          new = '''    elif any(x in texto for x in ("podria debutar", "puede debutar", "debut posible")):
              tipo = "DEBUT_POSIBLE"
          elif "convoc" in texto:
              tipo = "CONVOCATORIA"
          '''.replace('              ', '        ').replace('          elif', '    elif').replace('          ', '')
          if old not in text:
              raise SystemExit('classification block not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('src/fuentes_equipos.py')
          text = path.read_text()
          old = 'def fuentes_equipo(equipo: str) -> tuple[FuenteEquipo, ...]:\n    return FUENTES_POR_EQUIPO.get(canonical_team_key(equipo), ())\n'
          new = 'def fuentes_equipo(equipo: str) -> tuple[FuenteEquipo, ...]:\n    clave = canonical_team_key(equipo)\n    if clave == "xolos de tijuana":\n        clave = "tijuana"\n    return FUENTES_POR_EQUIPO.get(clave, ())\n'
          if old not in text:
              raise SystemExit('source function not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: ruff format src/contexto_web_partidos.py src/fuentes_equipos.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/contexto_web_partidos.py src/fuentes_equipos.py
          git commit -m 'fix: classify debut first and resolve Xolos alias'
          git push

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy src/ --show-error-codes
      - name: Sanity check (estructura)
        run: python -c "import os; assert os.path.isdir('src') and os.path.isfile('run_bot_prod.sh')"
      - name: Run tests
        run: python -m pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=64
