name: Format PR 65

on:
  push:
    branches:
      - fix/cache-por-argumentos-y-ttl-momios

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cache-por-argumentos-y-ttl-momios
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Ruff fixes
        run: |
          pip install ruff
          ruff check --fix src/cache_ttl.py src/comparador_mercado.py tests/test_cache_robustez.py
          ruff format src/cache_ttl.py src/comparador_mercado.py tests/test_cache_robustez.py
      - name: Commit formatting and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-pr65.yml
          git add src/cache_ttl.py src/comparador_mercado.py tests/test_cache_robustez.py
          git commit -m "style(cache): aplicar formato Ruff"
          git push
