name: Fix timeout indentation
on:
  push:
    branches: [mini/optimize-survivor-timeout]
    paths: [.github/workflows/fix-timeout-indentation.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/planificador_survivor.py')
          s = p.read_text()
          start = s.index('# Horizonte móvil para acotar el crecimiento exponencial del DP.')
          end = s.index('    usados = {canonical_team_key(e) for e in (equipos_usados or [])}', start)
          block = s[start:end]
          indented = ''.join(('    ' + line) if line.strip() else line for line in block.splitlines(keepends=True))
          p.write_text(s[:start] + indented + s[end:])
          PY
          ruff check --fix --unsafe-fixes src/planificador_survivor.py tests/test_planificador_survivor.py
          ruff format src/planificador_survivor.py tests/test_planificador_survivor.py
          pytest -q tests/test_planificador_survivor.py
          rm -f timeout-diagnostics.txt .github/workflows/fix-timeout-indentation.yml
          git config user.name "Mini manual fixer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep rolling horizon inside planner"
          git push
