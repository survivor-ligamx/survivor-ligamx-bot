name: Fix survivor test
on:
  push:
    branches: [copilot/mejora-planificador-survivor]
    paths: [.github/workflows/fix-diagnostics.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_planificador_survivor.py')
          s = p.read_text().replace('ps.pm.calcular_fuerzas(_resultados())', 'ps.pm.calcular_fuerzas(_historico())')
          p.write_text(s)
          PY
          rm -f ci-diagnostics.txt .github/workflows/fix-diagnostics.yml
          git config user.name "Mini manual fixer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test: use existing survivor history fixture"
          git push
