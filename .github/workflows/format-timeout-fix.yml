name: Format timeout optimization
on:
  push:
    branches: [mini/optimize-survivor-timeout]
    paths: [.github/workflows/format-timeout-fix.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: |
          ruff check --fix --unsafe-fixes src/planificador_survivor.py tests/test_planificador_survivor.py
          ruff format src/planificador_survivor.py tests/test_planificador_survivor.py
          rm .github/workflows/format-timeout-fix.yml
          git config user.name "Mini manual fixer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style: format rolling-horizon planner"
          git push
