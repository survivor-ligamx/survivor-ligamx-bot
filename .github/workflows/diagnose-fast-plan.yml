name: Diagnose fast plan
on:
  push:
    branches: [mini/fast-plan-data]
    paths: [.github/workflows/diagnose-fast-plan.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: |
          : > fast-plan-diagnostics.txt
          echo '=== RUFF ===' >> fast-plan-diagnostics.txt
          ruff check . >> fast-plan-diagnostics.txt 2>&1 || true
          echo '=== FORMAT ===' >> fast-plan-diagnostics.txt
          ruff format --check . >> fast-plan-diagnostics.txt 2>&1 || true
          echo '=== MYPY ===' >> fast-plan-diagnostics.txt
          mypy src/ --show-error-codes >> fast-plan-diagnostics.txt 2>&1 || true
          echo '=== TEST ===' >> fast-plan-diagnostics.txt
          pytest -q >> fast-plan-diagnostics.txt 2>&1 || true
          rm .github/workflows/diagnose-fast-plan.yml
          git config user.name "Mini manual fixer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: capture fast-plan diagnostics"
          git push
