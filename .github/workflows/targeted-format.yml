name: Targeted format
on:
  push:
    branches: [copilot/mejora-planificador-survivor]
    paths: [.github/workflows/targeted-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: |
          ruff check --fix --unsafe-fixes src/planificador_survivor.py src/routers/predicciones.py src/telegram/plan_persistido.py tests/test_planificador_survivor.py tests/test_plan_persistido.py tests/test_telegram_pronosticos.py || true
          ruff format src/planificador_survivor.py src/routers/predicciones.py src/telegram/plan_persistido.py tests/test_planificador_survivor.py tests/test_plan_persistido.py tests/test_telegram_pronosticos.py
          rm .github/workflows/targeted-format.yml
          git config user.name "Mini manual fixer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style: format survivor planner changes"
          git push
