name: Diagnose timeout PR
on:
  push:
    branches: [mini/optimize-survivor-timeout]
    paths: [.github/workflows/diagnose-timeout-pr.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: |
          : > timeout-diagnostics.txt
          echo '=== RUFF ===' >> timeout-diagnostics.txt
          ruff check . >> timeout-diagnostics.txt 2>&1 || true
          echo '=== FORMAT ===' >> timeout-diagnostics.txt
          ruff format --check . >> timeout-diagnostics.txt 2>&1 || true
          echo '=== MYPY ===' >> timeout-diagnostics.txt
          mypy src/ --show-error-codes >> timeout-diagnostics.txt 2>&1 || true
          echo '=== TEST ===' >> timeout-diagnostics.txt
          pytest -q tests/test_planificador_survivor.py >> timeout-diagnostics.txt 2>&1 || true
          rm -f .github/workflows/diagnose-timeout-pr.yml .github/workflows/format-timeout-fix.yml
          git config user.name "Mini manual fixer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: capture timeout optimization diagnostics"
          git push
