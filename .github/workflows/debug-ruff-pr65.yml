name: Debug Ruff PR 65

on:
  push:
    branches:
      - fix/cache-por-argumentos-y-ttl-momios

permissions:
  contents: write

jobs:
  debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cache-por-argumentos-y-ttl-momios
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture Ruff output
        run: |
          pip install ruff
          set +e
          ruff check src/cache_ttl.py src/comparador_mercado.py tests/test_cache_robustez.py > debug-ruff-pr65.txt 2>&1
          ruff format --check src/cache_ttl.py src/comparador_mercado.py tests/test_cache_robustez.py >> debug-ruff-pr65.txt 2>&1
          exit 0
      - name: Commit diagnostic and clean workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/debug-ruff-pr65.yml .github/workflows/format-pr65.yml
          git add debug-ruff-pr65.txt
          git commit -m "chore: registrar diagnóstico Ruff del PR 65"
          git push
