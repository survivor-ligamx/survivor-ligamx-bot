name: Fix fast plan types
on:
  push:
    branches: [mini/fast-plan-data]
    paths: [.github/workflows/fix-fast-plan-types.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routers/predicciones.py')
          s = p.read_text()
          old = '''        calibracion = (
                      plan_mod.preparar_calibracion_segura(datos["resultados"])
                      if usar_calibracion
                      else {
                          "aplicada": False,
                          "alpha": 0.0,
                          "base": None,
                          "criterio": "opt-in por latencia",
                          "fallback": "sin calibrar",
                          "motivo": "usar_calibracion=false",
                          "parametros_planificador": {"aplicar": False},
                      }
                  )
          '''
          new = '''        calibracion: Dict[str, Any]
                  if usar_calibracion:
                      calibracion = plan_mod.preparar_calibracion_segura(datos["resultados"])
                  else:
                      calibracion = {
                          "aplicada": False,
                          "alpha": 0.0,
                          "base": None,
                          "criterio": "opt-in por latencia",
                          "fallback": "sin calibrar",
                          "motivo": "usar_calibracion=false",
                          "parametros_planificador": {"aplicar": False},
                      }
          '''
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f fast-plan-diagnostics.txt .github/workflows/fix-fast-plan-types.yml
          git config user.name "Mini manual fixer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: type fast-plan calibration metadata"
          git push
