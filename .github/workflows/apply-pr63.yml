name: Apply PR 63 implementation

on:
  push:
    branches:
      - fix/parsing-y-dedup-fuentes

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/parsing-y-dedup-fuentes
          fetch-depth: 0
      - name: Apply minimal source changes
        run: |
          python - <<'PY'
          from pathlib import Path

          espn = Path("src/espn_data.py")
          text = espn.read_text(encoding="utf-8")
          old_import = "import argparse\nimport json\n"
          new_import = "import argparse\nimport json\nimport math\n"
          assert text.count(old_import) == 1
          text = text.replace(old_import, new_import, 1)

          marker = '''\ndef parsear_eventos(data: Dict[str, Any]) -> List[Dict[str, Any]]:\n'''
          helper = '''\ndef _marcador_entero(valor: Any) -> Optional[int]:\n    \"\"\"Convierte scores enteros de ESPN sin truncar valores fraccionarios.\"\"\"\n    if isinstance(valor, bool):\n        return None\n    try:\n        numero = float(valor)\n    except (TypeError, ValueError):\n        return None\n    if not math.isfinite(numero) or numero < 0 or not numero.is_integer():\n        return None\n    return int(numero)\n\n\ndef parsear_eventos(data: Dict[str, Any]) -> List[Dict[str, Any]]:\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, helper, 1)

          old_scores = '''        if jugado:\n            try:\n                partido[\"home_goals\"] = int(cast(Any, hg))\n                partido[\"away_goals\"] = int(cast(Any, ag))\n            except (TypeError, ValueError):\n                partido[\"jugado\"] = False\n'''
          new_scores = '''        if jugado:\n            home_goals = _marcador_entero(hg)\n            away_goals = _marcador_entero(ag)\n            if home_goals is None or away_goals is None:\n                partido[\"jugado\"] = False\n            else:\n                partido[\"home_goals\"] = home_goals\n                partido[\"away_goals\"] = away_goals\n'''
          assert text.count(old_scores) == 1
          text = text.replace(old_scores, new_scores, 1)
          espn.write_text(text, encoding="utf-8")

          fuentes = Path("src/fuentes_datos.py")
          text = fuentes.read_text(encoding="utf-8")
          old_import = "from src import ligamx_api\n"
          new_import = "from src import ligamx_api\nfrom src.team_normalizer import canonical_team_key\n"
          assert text.count(old_import) == 1
          text = text.replace(old_import, new_import, 1)

          old_combinar = '''def _combinar(a: List[Dict[str, Any]], b: List[Dict[str, Any]]) -> List[Dict[str, Any]]:\n    vistos = set()\n    out: List[Dict[str, Any]] = []\n    for fuente in (a, b):\n        for r in fuente:\n            clave = (str(r.get(\"home_team\")).lower(), str(r.get(\"away_team\")).lower(), str(r.get(\"fecha\")))\n            if clave in vistos:\n                continue\n            vistos.add(clave)\n            out.append(r)\n    return out\n'''
          new_combinar = '''def _fecha_clave(valor: Any) -> str:\n    \"\"\"Normaliza la parte de fecha compartida por las fuentes.\"\"\"\n    return str(valor or \"\").strip()[:10]\n\n\ndef _combinar(a: List[Dict[str, Any]], b: List[Dict[str, Any]]) -> List[Dict[str, Any]]:\n    \"\"\"Combina preservando prioridad de ``a`` y deduplicando aliases.\"\"\"\n    vistos = set()\n    out: List[Dict[str, Any]] = []\n    for fuente in (a, b):\n        for r in fuente:\n            clave = (\n                canonical_team_key(str(r.get(\"home_team\") or \"\")),\n                canonical_team_key(str(r.get(\"away_team\") or \"\")),\n                _fecha_clave(r.get(\"fecha\")),\n            )\n            if clave in vistos:\n                continue\n            vistos.add(clave)\n            out.append(r)\n    return out\n'''
          assert text.count(old_combinar) == 1
          text = text.replace(old_combinar, new_combinar, 1)
          fuentes.write_text(text, encoding="utf-8")
          PY
      - name: Commit implementation and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-pr63.yml
          git add src/espn_data.py src/fuentes_datos.py
          git commit -m "fix(datos): robustecer marcadores ESPN y deduplicación"
          git push
