name: Apply fast plan data path
on:
  push:
    branches: [mini/fast-plan-data]
    paths: [.github/workflows/fast-plan-data.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routers/predicciones.py')
          s = p.read_text()
          marker = '\n\ndef _partidos_jugados_torneo() -> Optional[int]:\n'
          helper = '''\n\ndef _resultados_plan_rapidos() -> Dict[str, Any]:
              """Usa primero el snapshot local para no hacer 18 llamadas ESPN en una petición."""
              cache = fuentes_mod.leer_cache()
              if len(cache) >= fuentes_mod.MIN_ACEPTABLE:
                  return {"fuente": "cache_local", "resultados": cache, "total": len(cache)}
              return fuentes_mod.obtener_resultados(meses=3)
          '''
          assert marker in s
          s = s.replace(marker, helper + marker, 1)
          old_sig = '''    usar_momios: bool = True,
              vida_empate_consumida: bool = False,
          ) -> Dict[str, Any]:
          '''
          new_sig = '''    usar_momios: bool = True,
              vida_empate_consumida: bool = False,
              usar_calibracion: bool = False,
          ) -> Dict[str, Any]:
          '''
          assert old_sig in s
          s = s.replace(old_sig, new_sig, 1)
          old = '''        datos = fuentes_mod.obtener_resultados(meses=18)
                  fuerzas = pm.calcular_fuerzas(datos["resultados"])
                  odds = plan_mod.construir_odds_por_partido(calendario) if usar_momios else None
                  calibracion = plan_mod.preparar_calibracion_segura(datos["resultados"])
          '''
          new = '''        datos = _resultados_plan_rapidos()
                  fuerzas = pm.calcular_fuerzas(datos["resultados"])
                  odds = plan_mod.construir_odds_por_partido(calendario) if usar_momios else None
                  calibracion = (
                      plan_mod.preparar_calibracion_segura(datos["resultados"])
                      if usar_calibracion
                      else {
                          "aplicada": False,
                          "alpha": 0.0,
                          "base": None,
                          "criterio": "opt-in por latencia",
                          "fallback": "sin calibrar",
                          "motivo": "usar_calibracion=false",
                          "parametros_planificador": {"aplicar": False},
                      }
                  )
          '''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          ruff check --fix --unsafe-fixes src/routers/predicciones.py
          ruff format src/routers/predicciones.py
          rm .github/workflows/fast-plan-data.yml
          git config user.name "Mini manual fixer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "perf: serve survivor plan from local history snapshot"
          git push
