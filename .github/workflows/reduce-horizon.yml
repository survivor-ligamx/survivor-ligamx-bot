name: Reduce survivor horizon
on:
  push:
    branches: [mini/reduce-survivor-horizon]
    paths: [.github/workflows/reduce-horizon.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/planificador_survivor.py')
          s = p.read_text()
          old = '    horizonte_exacto: int = 6,\n'
          assert s.count(old) == 1
          p.write_text(s.replace(old, '    horizonte_exacto: int = 3,\n'))
          d = Path('docs/survivor-policy.md')
          ds = d.read_text().replace('horizonte móvil de bloques exactos', 'horizonte móvil corto de bloques exactos')
          d.write_text(ds)
          PY
          rm .github/workflows/reduce-horizon.yml
          git config user.name "Mini manual fixer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "perf: use three-round production horizon"
          git push
