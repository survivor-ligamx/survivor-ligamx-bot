name: Apply PR 65 implementation

on:
  push:
    branches:
      - fix/cache-por-argumentos-y-ttl-momios

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cache-por-argumentos-y-ttl-momios
          fetch-depth: 0
      - name: Implement argument-aware cache and strict odds TTL
        run: |
          cat > src/cache_ttl.py <<'PY'
          #!/usr/bin/env python3
          """Caché TTL en memoria por combinación de argumentos."""

          from __future__ import annotations

          from collections.abc import Callable
          from functools import wraps
          import time
          from typing import Any, ParamSpec, TypeVar, cast

          P = ParamSpec("P")
          R = TypeVar("R")


          def _congelar(valor: Any) -> Any:
              """Convierte estructuras mutables comunes en una clave hashable estable."""
              if isinstance(valor, dict):
                  pares = ((_congelar(k), _congelar(v)) for k, v in valor.items())
                  return ("dict", tuple(sorted(pares, key=repr)))
              if isinstance(valor, list):
                  return ("list", tuple(_congelar(v) for v in valor))
              if isinstance(valor, tuple):
                  return ("tuple", tuple(_congelar(v) for v in valor))
              if isinstance(valor, (set, frozenset)):
                  return ("set", tuple(sorted((_congelar(v) for v in valor), key=repr)))
              try:
                  hash(valor)
              except TypeError:
                  return ("repr", type(valor).__qualname__, repr(valor))
              return ("hash", valor)


          def ttl_cache(segundos: int = 600) -> Callable[[Callable[P, R]], Callable[P, R]]:
              """Cachea cada combinación de ``args`` y ``kwargs`` durante el TTL."""

              def deco(fn: Callable[P, R]) -> Callable[P, R]:
                  estado: dict[Any, tuple[float, R]] = {}

                  @wraps(fn)
                  def wrapper(*args: P.args, **kwargs: P.kwargs) -> R:
                      ahora = time.monotonic()
                      clave = (_congelar(args), _congelar(kwargs))
                      entrada = estado.get(clave)
                      if entrada is None or ahora - entrada[0] > segundos:
                          valor = fn(*args, **kwargs)
                          estado[clave] = (ahora, valor)
                          return valor
                      return entrada[1]

                  def cache_clear() -> None:
                      estado.clear()

                  setattr(wrapper, "cache_clear", cache_clear)
                  return cast(Callable[P, R], wrapper)

              return deco
          PY

          python - <<'PY'
          from pathlib import Path
          path = Path("src/comparador_mercado.py")
          text = path.read_text(encoding="utf-8")
          old = '''        if max_edad_horas and max_edad_horas > 0:
              ts = payload.get("generado_utc")
              if ts:
                  try:
                      generado = datetime.strptime(str(ts), "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)
                      edad = datetime.now(timezone.utc) - generado
                      if edad.total_seconds() > max_edad_horas * 3600:
                          logger.warning(
                              "Caché de momios expirada (%.1f h > %.1f h). Se ignora.",
                              edad.total_seconds() / 3600,
                              max_edad_horas,
                          )
                          return {}
                  except Exception:
                      logger.warning("No se pudo validar timestamp de momios; se usará con precaución.")
          '''
          new = '''        if max_edad_horas and max_edad_horas > 0:
              ts = payload.get("generado_utc")
              if not ts:
                  logger.warning("Caché de momios sin timestamp; se ignora.")
                  return {}
              try:
                  generado = datetime.strptime(str(ts), "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)
                  edad = datetime.now(timezone.utc) - generado
                  if edad.total_seconds() > max_edad_horas * 3600:
                      logger.warning(
                          "Caché de momios expirada (%.1f h > %.1f h). Se ignora.",
                          edad.total_seconds() / 3600,
                          max_edad_horas,
                      )
                      return {}
              except (TypeError, ValueError):
                  logger.warning("Timestamp de momios inválido; se ignora la caché.")
                  return {}
          '''
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit implementation and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-pr65.yml
          git add src/cache_ttl.py src/comparador_mercado.py
          git commit -m "fix(cache): separar claves y validar timestamp de momios"
          git push
