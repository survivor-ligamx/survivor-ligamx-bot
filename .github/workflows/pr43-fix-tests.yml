name: PR 43 one-time test fixes

on:
  push:
    branches:
      - copilot/fix-308490185-1289689659-68343ccb-cd87-4d5d-8e2a-06040aa18600

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: copilot/fix-308490185-1289689659-68343ccb-cd87-4d5d-8e2a-06040aa18600
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install 'ruff>=0.15.0'
      - name: Fix event precedence and Xolos alias
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/contexto_web_partidos.py')
          text = path.read_text()
          old = '''    elif "convoc" in texto:
        tipo = "CONVOCATORIA"
    elif any(x in texto for x in ("podria debutar", "puede debutar", "debut posible")):
        tipo = "DEBUT_POSIBLE"
'''
          new = '''    elif any(x in texto for x in ("podria debutar", "puede debutar", "debut posible")):
        tipo = "DEBUT_POSIBLE"
    elif "convoc" in texto:
        tipo = "CONVOCATORIA"
'''
          if old not in text:
              raise SystemExit('No se encontró el bloque de clasificación esperado')
          path.write_text(text.replace(old, new, 1))

          path = Path('src/fuentes_equipos.py')
          text = path.read_text()
          old = '''def fuentes_equipo(equipo: str) -> tuple[FuenteEquipo, ...]:
    return FUENTES_POR_EQUIPO.get(canonical_team_key(equipo), ())
'''
          new = '''def fuentes_equipo(equipo: str) -> tuple[FuenteEquipo, ...]:
    clave = canonical_team_key(equipo)
    if clave == "xolos de tijuana":
        clave = "tijuana"
    return FUENTES_POR_EQUIPO.get(clave, ())
'''
          if old not in text:
              raise SystemExit('No se encontró la función de fuentes esperada')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: ruff format src/contexto_web_partidos.py src/fuentes_equipos.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/contexto_web_partidos.py src/fuentes_equipos.py
          git commit -m 'fix: classify debut before call-up and resolve Xolos alias'
          git push
