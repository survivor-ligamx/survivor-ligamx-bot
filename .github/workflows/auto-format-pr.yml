name: Format and validate survivor PR
on:
  push:
    branches: [copilot/mejora-planificador-survivor]
    paths: [.github/workflows/auto-format-pr.yml]
permissions:
  contents: write
jobs:
  format-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check --fix .
      - run: ruff format .
      - run: |
          rm .github/workflows/auto-format-pr.yml
          git config user.name "Mini manual fixer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style: format reviewed survivor changes"
          git push
      - run: mypy src/ --show-error-codes
      - run: python -m pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=64
